name: Build Unsigned IPA

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          bundle install 2>/dev/null || true
          pod install --repo-update

      - name: Fix project SKIP_INSTALL setting
        run: |
          # Expo/RN sets SKIP_INSTALL=YES in the main app target, which prevents
          # xcodebuild archive from placing the .app in the xcarchive Products dir.
          # Patch only the main Hayase project (not Pods) before archiving.
          sed -i '' 's/SKIP_INSTALL = YES;/SKIP_INSTALL = NO;/g' \
            ios/Hayase.xcodeproj/project.pbxproj || true

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Hayase.xcworkspace \
            -scheme "Hayase" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/Hayase.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          # Find the .app bundle in the xcarchive (SKIP_INSTALL=NO puts it here)
          APP_PATH=$(find "$RUNNER_TEMP/Hayase.xcarchive/Products" -name "*.app" -type d | head -1)
          # Fallback: check DerivedData build products directory
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name "*.app" -type d | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            echo "Archive Products:"
            find "$RUNNER_TEMP/Hayase.xcarchive" -type d -maxdepth 5 2>/dev/null || echo "(no archive)"
            echo "DerivedData Build Products:"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -type d -maxdepth 3 2>/dev/null || echo "(no DerivedData)"
            exit 1
          fi
          echo "Found app: $APP_PATH"

          # Strip any embedded code signatures that may be invalid
          find "$APP_PATH" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true

          # Re-sign with ad-hoc identity so the IPA structure is valid
          /usr/bin/codesign --force --sign - --deep --preserve-metadata=identifier,entitlements "$APP_PATH" 2>/dev/null || true

          # Create Payload structure and zip into IPA
          STAGE_DIR="$RUNNER_TEMP/ipa_stage"
          mkdir -p "$STAGE_DIR/Payload"
          cp -R "$APP_PATH" "$STAGE_DIR/Payload/"

          cd "$STAGE_DIR"
          zip -r -9 "$RUNNER_TEMP/Hayase.ipa" Payload

          echo "IPA size: $(du -h "$RUNNER_TEMP/Hayase.ipa" | cut -f1)"
          echo "IPA contents:"
          unzip -l "$RUNNER_TEMP/Hayase.ipa" | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hayase-unsigned
          path: ${{ runner.temp }}/Hayase.ipa
          retention-days: 90
