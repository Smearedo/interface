name: Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
            
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run ts:check
